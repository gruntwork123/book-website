   </div>
  </section>
  <section className="py-9 sm:py-11"><div className="flex flex-wrap items-end justify-between gap-4 mb-5"><div><p className="section-eyebrow mb-2">Follow your curiosity</p><h2 className="section-title serif text-2xl sm:text-3xl font-bold">Browse by mood</h2></div><p className="text-sm text-muted max-w-sm">From old favorites to faraway worlds, there's a shelf for every kind of reader.</p></div>
   <div className="flex flex-wrap gap-2">${GENRES.map(g=>html`<button key=${g} className="chip" onClick=${()=>go('catalog',{g,q:''})}>${g}</button>`)}</div></section>
  <div className="quiet-rule"></div>
  <div className="flex items-end justify-between mb-5 mt-8"><div><p className="section-eyebrow mb-2">Picked for your next chapter</p><h2 className="section-title serif text-2xl sm:text-3xl font-bold">Featured books</h2></div><button className="text-brand text-sm font-semibold inline-flex items-center gap-1" onClick=${()=>go('catalog')}>Browse all <${Icon} n="ArrowRight" s=${16}/></button></div>
  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">${[...all].sort((a,b)=>b.st.avg-a.st.avg).slice(0,4).map(({b,st})=>html`<${Card} key=${b.id} b=${b} st=${st} onOpen=${()=>setOpen(b.id)}/>`)}</div></div>`}
 ${view==='catalog'&&html`<div className="pt-8"><p className="section-eyebrow mb-2">Find a story to get lost in</p><h1 className="serif text-3xl font-bold mb-5">The library</h1>
  <div className="catalog-panel bg-card border border-line rounded-xl p-4 grid grid-cols-2 lg:grid-cols-6 gap-3">
   <div className="col-span-2"><input placeholder="Search\u2026" value=${f.q} onChange=${e=>upd({q:e.target.value})}/></div>
   <select aria-label="Genre" value=${f.g} onChange=${e=>upd({g:e.target.value})}><option value="">All genres</option>${GENRES.map(g=>html`<option key=${g}>${g}</option>`)}</select>
   <select aria-label="Author" value=${f.a} onChange=${e=>upd({a:e.target.value})}><option value="">All authors</option>${authors.map(a=>html`<option key=${a}>${a}</option>`)}</select>
   <select aria-label="Rating" value=${f.r} onChange=${e=>upd({r:+e.target.value})}><option value="0">Any rating</option><option value="4">4+ stars</option><option value="4.5">4.5+ stars</option></select>
   <select aria-label="Year" value=${f.y} onChange=${e=>upd({y:e.target.value})}><option value="">Any year</option><option value="old">Before 1950</option><option value="mid">1950\u20131999</option><option value="new">2000 onward</option></select></div>
  <div className="flex flex-wrap items-center justify-between gap-3 my-4"><span className="text-sm text-muted">${list.length} book${list.length===1?'':'s'}</span>
   <div className="flex items-center gap-2 text-sm">Sort<select style=${{width:'auto'}} value=${f.s} onChange=${e=>upd({s:e.target.value})}><option value="rated">Highest Rated</option><option value="new">Newest Releases</option><option value="rev">Most Reviewed</option></select>
   <button className="btn" onClick=${()=>setF({q:'',g:'',a:'',r:0,y:'',s:'rated'})}>Reset</button></div></div>
  ${list.length?html`<div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${list.map(({b,st})=>html`<${Card} key=${b.id} b=${b} st=${st} onOpen=${()=>setOpen(b.id)}/>`)}</div>`:html`<p className="text-center text-muted py-16">No books match your filters.</p>`}</div>`}
 ${view==='profile'&&html`<div className="pt-8"><div className="flex items-center gap-4 mb-6"><${Avatar} name="You" s=${64}/><div><h1 className="serif text-3xl font-bold">Your bookshelf</h1><p className="text-muted text-sm">${Object.keys(shelf).length} books shelved \u00b7 ${mine.length} reviews written</p></div></div>
  <div className="flex gap-2 flex-wrap mb-5">${STATUS.map(([k,l])=>html`<button key=${k} onClick=${()=>setTab(k)} className=${'chip '+(tab===k?'on':'')}>${l} (${Object.values(shelf).filter(v=>v===k).length})</button>`)}</div>
  ${(()=>{const items=all.filter(({b})=>shelf[b.id]===tab);return items.length?html`<div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">${items.map(({b,st})=>html`<${Card} key=${b.id} b=${b} st=${st} onOpen=${()=>setOpen(b.id)}/>`)}</div>`:html`<p className="text-muted">Nothing here yet. Add books from the catalog.</p>`})()}
  <h2 className="serif text-2xl font-bold mt-10 mb-4">My reviews</h2>
  ${mine.length?html`<div className="space-y-3">${mine.map(r=>{const b=BOOKS.find(x=>x.id===r.b);return html`<article key=${r.id} className="bg-card border border-line rounded-xl p-4"><div className="flex justify-between gap-3 flex-wrap"><button className="serif font-bold text-brand" onClick=${()=>setOpen(b.id)}>${b.t}</button><span className="text-xs text-muted">${fmt(r.d)}</span></div><${Stars} v=${r.r} s=${14}/><h4 className="font-semibold mt-1">${r.t}</h4><p className="text-sm mt-1">${r.x}</p></article>`})}</div>`:html`<p className="text-muted">You haven\u2019t reviewed anything yet. Open a book and post your first review.</p>`}</div>`}
 </main>
 <footer className="site-footer"><div className="max-w-6xl mx-auto px-4 py-6 flex flex-wrap items-center justify-between gap-3 text-xs"><span className="serif text-base font-semibold text-brand">Cambo Book <span className="font-normal text-muted">· A home for book people</span></span><span>Read a little. Find a lot.</span></div></footer>
 ${ob&&html`<${Detail} b=${ob.b} st=${ob.st} mine=${mine} shelf=${shelf} setShelf=${setShelf} addReview=${r=>setMine(p=>[r,...p])} close=${()=>setOpen(null)}/>`}
 </div>`}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
